<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi Tap - Bitcoin Mini App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://adsgram.ai/js/adv_engine.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .coin-btn {
            transition: transform 0.05s ease;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-lg">
        <div class="flex items-center gap-2">
            <i class="fa-brands fa-bitcoin text-amber-500 text-2xl"></i>
            <span class="font-bold text-lg tracking-wide">Satoshi Tap</span>
        </div>
        <div class="bg-amber-500/10 text-amber-400 font-semibold px-3 py-1 rounded-full border border-amber-500/30 text-sm">
            v1.0
        </div>
    </header>

    <!-- Score Section -->
    <main class="flex flex-col items-center justify-center my-auto gap-6">
        <div class="text-center">
            <p class="text-slate-400 text-sm font-medium tracking-wider uppercase mb-1">I tuoi Satoshi</p>
            <div class="flex items-center justify-center gap-2">
                <i class="fa-brands fa-bitcoin text-amber-400 text-4xl"></i>
                <span id="score" class="text-5xl font-extrabold text-amber-400">0</span>
            </div>
        </div>

        <!-- Tap Button -->
        <button id="tapBtn" class="coin-btn relative rounded-full p-2 bg-amber-500/20 border-4 border-amber-500/40 shadow-[0_0_50px_rgba(245,158,11,0.3)] focus:outline-none">
            <div class="w-48 h-48 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center border-4 border-amber-300 shadow-inner">
                <i class="fa-brands fa-bitcoin text-white text-8xl drop-shadow-lg"></i>
            </div>
        </button>

        <!-- Earn Rewarded Ad Button -->
        <button id="adBtn" onclick="watchAdForReward()" class="w-full max-w-xs bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg border border-purple-400/30 flex items-center justify-center gap-3 active:scale-95 transition">
            <i class="fa-solid fa-play-circle text-xl text-yellow-300"></i>
            <span>Guarda Video (+100 Satoshi)</span>
        </button>
    </main>

    <!-- Footer Stats -->
    <footer class="bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700/50 flex justify-around text-center">
        <div>
            <p class="text-xs text-slate-400">Energia</p>
            <p class="font-bold text-slate-200">1000 / 1000</p>
        </div>
        <div class="border-r border-slate-700"></div>
        <div>
            <p class="text-xs text-slate-400">Tap Power</p>
            <p class="font-bold text-amber-400">+1</p>
        </div>
    </footer>

    <!-- Logic Script -->
    <script>
        // Inizializza Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('satoshi_score')) || 0;
        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');

        scoreEl.innerText = score.toLocaleString();

        // Funzione Tap
        tapBtn.addEventListener('click', (e) => {
            score += 1;
            scoreEl.innerText = score.toLocaleString();
            localStorage.setItem('satoshi_score', score);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Inizializza Adsgram con Block ID
        const AdController = window.Adsgram.init({ blockId: "55502" });

        // Funzione per mostrare la pubblicità
        function watchAdForReward() {
            AdController.show().then((result) => {
                // Ricompensa per visione completa
                score += 100;
                scoreEl.innerText = score.toLocaleString();
                localStorage.setItem('satoshi_score', score);
                
                if (tg.showAlert) {
                    tg.showAlert("Complimenti! Hai ricevuto +100 Satoshi!");
                } else {
                    alert("Complimenti! Hai ricevuto +100 Satoshi!");
                }
            }).catch((error) => {
                console.log("Annuncio non completato o errore:", error);
            });
        }
    </script>
</body>
</html>
