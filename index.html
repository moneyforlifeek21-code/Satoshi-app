<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Satoshi Tap - Ripartenza Pulita</title>

  <!-- SDK Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    .app-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .counter-container {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 18px;
      padding: 20px 15px;
      margin-bottom: 24px;
    }

    .counter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .counter-value {
      font-size: 26px;
      font-weight: 900;
      color: #f59e0b;
      font-family: monospace;
      word-break: break-all;
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s ease;
    }

    .btn-start:active {
      transform: scale(0.97);
    }

    .btn-start.active {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="app-title">⚡ Satoshi Cloud Miner</div>

    <div class="counter-container">
      <div class="counter-label">Saldo Minato</div>
      <div class="counter-value" id="satoshi-display">0.00000000000</div>
    </div>

    <button class="btn-start" id="start-btn" onclick="toggleMining()">START</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.expand(); tg.ready(); } catch(e) {} }

    let satoshiBalance = parseFloat(localStorage.getItem('clean_satoshi')) || 0.00000000000;
    let isMining = localStorage.getItem('clean_is_mining') === 'true';

    const displayEl = document.getElementById('satoshi-display');
    const startBtn = document.getElementById('start-btn');

    function updateUI() {
      displayEl.innerText = satoshiBalance.toFixed(11);
      if (isMining) {
        startBtn.innerText = "STOP";
        startBtn.classList.add('active');
      } else {
        startBtn.innerText = "START";
        startBtn.classList.remove('active');
      }
    }

    function toggleMining() {
      isMining = !isMining;
      localStorage.setItem('clean_is_mining', isMining);
      updateUI();
    }

    // Incremento in tempo reale di 0.00000000001 Satoshi al secondo
    setInterval(() => {
      if (isMining) {
        satoshiBalance += 0.00000000001;
        localStorage.setItem('clean_satoshi', satoshiBalance);
        updateUI();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
