<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Satoshi Tap - Friends</title>

  <!-- SDK Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* RESET E STILI DI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* CONTENITORE SCHERMATA FRIENDS */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* HEADER */
    .friends-header {
      text-align: center;
      padding: 24px 10px 16px;
    }

    .friends-header .icon-box {
      font-size: 56px;
      margin-bottom: 12px;
      line-height: 1;
    }

    .friends-header h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .friends-header p {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.4;
    }

    .friends-header p strong {
      color: #f7931a;
    }

    /* STATISTICHE */
    .stats-container {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }

    .stat-card {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-title {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #f7931a;
    }

    /* PULSANTI D'AZIONE */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn-primary {
      flex: 2;
      background: #f7931a;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #e08213;
    }

    .btn-secondary {
      flex: 1;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-secondary:active {
      transform: scale(0.98);
      background: #30363d;
    }

    /* LISTA AMICI */
    .friends-list-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .friends-list-container h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .friends-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .friend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      border: 1px solid #21262d;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .friend-avatar {
      width: 36px;
      height: 36px;
      background: #30363d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #f7931a;
      font-size: 14px;
    }

    .friend-name {
      font-weight: 600;
      color: #ffffff;
      font-size: 14px;
    }

    .friend-reward {
      color: #3fb950;
      font-weight: 700;
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      color: #8b949e;
      font-size: 14px;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <main class="screen">
    <!-- Header -->
    <div class="friends-header">
      <div class="icon-box">🤝</div>
      <h2>Invita Amici!</h2>
      <p>Ricevi il <strong>10%</strong> di tutti i token guadagnati dai tuoi amici.</p>
    </div>

    <!-- Statistiche -->
    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-title">Amici Invitati</span>
        <span id="friends-count" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Guadagni Referral</span>
        <span id="friends-earnings" class="stat-value">0 🪙</span>
      </div>
    </div>

    <!-- Pulsanti -->
    <div class="action-buttons">
      <button class="btn-primary" onclick="inviteFriend()">
        🚀 Invita un Amico
      </button>
      <button class="btn-secondary" onclick="copyReferralLink()">
        📋 Copia Link
      </button>
    </div>

    <!-- Lista Amici -->
    <div class="friends-list-container">
      <h3>I tuoi Amici</h3>
      <div id="friends-list" class="friends-list">
        <p class="empty-state">Non hai ancora invitato nessun amico.</p>
      </div>
    </div>
  </main>

  <script>
    // 1. INIZIALIZZAZIONE TELEGRAM WEBAPP
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.expand();
      tg.ready();
    }

    // 2. CONFIGURAZIONE DEL BOT
    // MODIFICA QUESTA RIGA: Inserisci il nome del tuo bot senza il simbolo @
    const BOT_USERNAME = "SatoshiTapBot";

    // Recupera l'ID dell'utente Telegram
    const userId = tg?.initDataUnsafe?.user?.id || "12345678";
    const referralLink = `https://t.me/${BOT_USERNAME}?start=ref_${userId}`;

    // 3. FUNZIONE PER CONDIVIDERE IL LINK IN CHAT
    function inviteFriend() {
      const shareText = "Unisciti a me su Satoshi Tap e inizia a guadagnare token! 🚀";
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}&text=${encodeURIComponent(shareText)}`;

      if (tg) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    // 4. FUNZIONE PER COPIARE IL LINK NEGLI APPUNTI
    function copyReferralLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(referralLink).then(() => {
          showAlert("Link copiato negli appunti!");
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      prompt("Copia il tuo link di invito:", referralLink);
    }

    function showAlert(message) {
      if (tg && tg.showAlert) {
        tg.showAlert(message);
      } else {
        alert(message);
      }
    }

    // 5. FUNZIONE PER POPOLARE LA SCHERMATA CON I DATI
    function updateFriendsUI(data) {
      document.getElementById('friends-count').innerText = data.totalFriends;
      document.getElementById('friends-earnings').innerText = `${data.totalEarnings.toLocaleString()} 🪙`;

      const listContainer = document.getElementById('friends-list');
      listContainer.innerHTML = '';

      if (!data.friends || data.friends.length === 0) {
        listContainer.innerHTML = '<p class="empty-state">Non hai ancora invitato nessun amico.</p>';
        return;
      }

      data.friends.forEach(friend => {
        const initial = friend.username ? friend.username.charAt(0).toUpperCase() : '?';
        const item = document.createElement('div');
        item.className = 'friend-item';
        item.innerHTML = `
          <div class="friend-info">
            <div class="friend-avatar">${initial}</div>
            <span class="friend-name">${friend.username || 'Amico Anonimo'}</span>
          </div>
          <span class="friend-reward">+${friend.earnedForYou.toLocaleString()} 🪙</span>
        `;
        listContainer.appendChild(item);
      });
    }

    // 6. CARICAMENTO DATI ALL'AVVIO
    document.addEventListener('DOMContentLoaded', () => {
      // Modello di test locale: sostituire con la chiamata al proprio server/database se presente
      const initialData = {
        totalFriends: 0,
        totalEarnings: 0,
        friends: []
      };

      updateFriendsUI(initialData);
    });
  </script>
</body>
</html>
