<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi Tap - Bitcoin Mini App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://adsgram.ai/js/adv_engine.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .coin-btn {
            transition: transform 0.05s ease;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 pb-20">

    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-lg">
        <div class="flex items-center gap-2">
            <i class="fa-brands fa-bitcoin text-amber-500 text-2xl"></i>
            <span class="font-bold text-lg tracking-wide">Satoshi Tap</span>
        </div>
        <div class="bg-amber-500/10 text-amber-400 font-semibold px-3 py-1 rounded-full border border-amber-500/30 text-sm">
            v1.0
        </div>
    </header>

    <!-- Main Game Section -->
    <main id="tab-mine" class="tab-content flex flex-col items-center justify-center my-auto gap-5">
        <div class="text-center">
            <p class="text-slate-400 text-sm font-medium tracking-wider uppercase mb-1">I tuoi Satoshi</p>
            <div class="flex items-center justify-center gap-2">
                <i class="fa-brands fa-bitcoin text-amber-400 text-4xl"></i>
                <span id="score" class="text-5xl font-extrabold text-amber-400">0</span>
            </div>
        </div>

        <!-- Tap Button -->
        <button id="tapBtn" class="coin-btn relative rounded-full p-2 bg-amber-500/20 border-4 border-amber-500/40 shadow-[0_0_50px_rgba(245,158,11,0.3)] focus:outline-none">
            <div class="w-44 h-44 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center border-4 border-amber-300 shadow-inner">
                <i class="fa-brands fa-bitcoin text-white text-8xl drop-shadow-lg"></i>
            </div>
        </button>

        <!-- Earn Rewarded Ad Button -->
        <button id="adBtn" onclick="watchAdForReward()" class="w-full max-w-xs bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg border border-purple-400/30 flex items-center justify-center gap-3 active:scale-95 transition">
            <i class="fa-solid fa-play-circle text-xl text-yellow-300"></i>
            <span>Guarda Video (+100 Satoshi)</span>
        </button>

        <!-- Stats -->
        <div class="w-full max-w-xs bg-slate-800/80 backdrop-blur p-3 rounded-2xl border border-slate-700/50 flex justify-around text-center mt-2">
            <div>
                <p class="text-xs text-slate-400">Energia</p>
                <p class="font-bold text-slate-200">1000 / 1000</p>
            </div>
            <div class="border-r border-slate-700"></div>
            <div>
                <p class="text-xs text-slate-400">Tap Power</p>
                <p class="font-bold text-amber-400">+1</p>
            </div>
        </div>
    </main>

    <!-- Wallet View Direct Input -->
    <main id="tab-wallet" class="tab-content hidden flex-col items-center justify-center my-auto gap-4 text-center p-4">
        <div class="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center border border-amber-500/30 mb-2">
            <i class="fa-solid fa-wallet text-amber-400 text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold">Ritiro Satoshi</h2>
        <p class="text-slate-400 text-sm max-w-xs">Inserisci il tuo indirizzo Wallet per ricevere le ricompense guadagnate nel gioco.</p>
        
        <!-- Input per l'indirizzo del Wallet -->
        <div class="w-full max-w-xs my-2">
            <input type="text" id="walletAddressInput" placeholder="Inserisci il tuo indirizzo Wallet (TON / BTC)" class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm rounded-xl p-3 focus:outline-none focus:border-amber-500 text-center">
        </div>

        <!-- Pulsante di Prelievo -->
        <button id="withdrawBtn" onclick="processWithdraw()" class="w-full max-w-xs bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 px-6 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Richiedi Prelievo</span>
        </button>
    </main>

    <!-- Generic View -->
    <main id="tab-generic" class="tab-content hidden flex-col items-center justify-center my-auto gap-4 text-center p-4">
        <i class="fa-solid fa-screwdriver-wrench text-amber-400 text-4xl"></i>
        <h2 id="generic-title" class="text-2xl font-bold">Sezione in arrivo</h2>
        <p class="text-slate-400 text-sm">Stiamo aggiornando questa sezione. Torna a trovarci presto!</p>
    </main>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700/80 px-2 py-2 flex justify-around items-center text-xs text-slate-400 z-50">
        <button onclick="switchTab('mine')" id="nav-mine" class="flex flex-col items-center gap-1 text-amber-400 font-semibold transition">
            <i class="fa-solid fa-hammer text-lg"></i>
            <span>Mine</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center gap-1 hover:text-white transition">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span>Tasks</span>
        </button>
        <button onclick="switchTab('daily')" id="nav-daily" class="flex flex-col items-center gap-1 hover:text-white transition">
            <i class="fa-solid fa-fire text-lg"></i>
            <span>Daily</span>
        </button>
        <button onclick="switchTab('friends')" id="nav-friends" class="flex flex-col items-center gap-1 hover:text-white transition">
            <i class="fa-solid fa-users text-lg"></i>
            <span>Friends</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 hover:text-white transition">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span>Wallet</span>
        </button>
    </nav>

    <!-- JavaScript Logica -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('satoshi_score')) || 115;
        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');

        if (scoreEl) scoreEl.innerText = score.toLocaleString();

        tapBtn.addEventListener('click', () => {
            score += 1;
            scoreEl.innerText = score.toLocaleString();
            localStorage.setItem('satoshi_score', score);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Adsgram Config
        const AdController = window.Adsgram.init({ blockId: "55502" });

        function watchAdForReward() {
            AdController.show().then((result) => {
                score += 100;
                scoreEl.innerText = score.toLocaleString();
                localStorage.setItem('satoshi_score', score);
                
                if (tg.showAlert) {
                    tg.showAlert("Complimenti! Hai ricevuto +100 Satoshi!");
                } else {
                    alert("Complimenti! Hai ricevuto +100 Satoshi!");
                }
            }).catch((error) => {
                console.log("Annuncio non completato o errore:", error);
            });
        }

        // Carica Wallet salvato se presente
        const savedAddress = localStorage.getItem('user_wallet_address') || '';
        if (savedAddress) {
            document.getElementById('walletAddressInput').value = savedAddress;
        }

        // Gestione Prelievo
        function processWithdraw() {
            const walletInput = document.getElementById('walletAddressInput').value.trim();

            if (!walletInput) {
                const msg = "Inserisci un indirizzo Wallet valido prima di proseguire!";
                if (tg.showAlert) tg.showAlert(msg); else alert(msg);
                return;
            }

            localStorage.setItem('user_wallet_address', walletInput);

            if (score < 1000) {
                const msg = `Indirizzo salvato:\n${walletInput}\n\nSoglia minima di ritiro: 1.000 Satoshi.\nIl tuo bilancio attuale: ${score} Satoshi.`;
                if (tg.showAlert) tg.showAlert(msg); else alert(msg);
            } else {
                const msg = `Richiesta di prelievo inviata con successo!\n\nIndirizzo: ${walletInput}\nImporto: ${score} Satoshi.`;
                if (tg.showAlert) tg.showAlert(msg); else alert(msg);
            }
        }

        // Navigazione schede
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-amber-400', 'font-semibold');
                el.classList.add('text-slate-400');
            });

            const activeNav = document.getElementById('nav-' + tabName);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-amber-400', 'font-semibold');
            }

            if (tabName === 'mine') {
                document.getElementById('tab-mine').classList.remove('hidden');
            } else if (tabName === 'wallet') {
                document.getElementById('tab-wallet').classList.remove('hidden');
                document.getElementById('tab-wallet').classList.add('flex');
            } else {
                document.getElementById('generic-title').innerText = tabName.toUpperCase();
                document.getElementById('tab-generic').classList.remove('hidden');
                document.getElementById('tab-generic').classList.add('flex');
            }
        }
    </script>
</body>
</html>
